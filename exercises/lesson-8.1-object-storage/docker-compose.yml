# Postgres (TaskFlow's OLTP database) and SeaweedFS (S3-compatible object storage) - both in containers;
# the scripts are ordinary Node processes on your machine.
# cpus: 2 on both - so that whatever your machine's core count, the comparison looks the same (like Lesson 7.6).
# Ports 5445/8335 - no clash with the earlier exercises.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5445:5432'
    cpus: 2
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

  s3:
    # SeaweedFS - an open-source object store that speaks the S3 API. In one container: the master (which file is on which
    # volume - metadata), the volume server (the real bytes), the filer and the S3 gateway - exactly the lesson's §1.4 picture.
    # (MinIO's community Docker image is no longer available on Docker Hub - hence this.)
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256 -volume.max=100
    ports:
      - '8335:8333'
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

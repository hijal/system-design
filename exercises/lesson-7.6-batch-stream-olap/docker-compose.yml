# Only Postgres in a container — in the role of TaskFlow's "production" OLTP database.
# DuckDB (analytics) needs no container: it is a library, keeping its data in a file (data/analytics.duckdb).
# cpus: 2 — a deliberate limit, so that whatever your machine's core count, the CPU fight between analytics and OLTP
# looks the same (a production database's cores are limited too). Port 5444 — no clash with the earlier exercises.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5444:5432'
    cpus: 2
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

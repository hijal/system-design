# Only PostgreSQL in a container - the scripts run as ordinary Node processes on your machine.
# Port 5436, so it doesn't clash with your machine's own Postgres (5432) or the earlier exercises
# (4.4 → 5433, 5.2 → 5434, 5.4 → 5435).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5436:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

# এই exercise এ শুধু Redis container এ চলে — API, worker আর নকল email provider
# তোমার মেশিনে সাধারণ Node process। Port 6381, যাতে আগে থেকে চলা Redis (বা Lesson 4.4 এর 6380)
# এর সাথে সংঘাত না লাগে।
services:
  redis:
    image: redis:8-alpine
    # Queue এর Redis আর cache এর Redis এর নিয়ম উল্টো (Lesson 4.3/4.4 এ ছিল allkeys-lru):
    #   noeviction   — memory ভরলে কোনো key ফেলে দেবে না; job ফেলে দেওয়া মানে কাজ হারানো
    #   appendonly   — প্রতিটা লেখা disk এর AOF file এ; Redis restart হলেও job থাকে
    #   everysec     — প্রতি সেকেন্ডে fsync: crash এ সর্বোচ্চ ~১ সেকেন্ডের লেখা হারাতে পারে
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    ports:
      - '6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  redis-data:

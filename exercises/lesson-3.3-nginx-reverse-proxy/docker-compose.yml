services:
  backend1:
    build: ./backend
    environment:
      - INSTANCE_ID=backend-1

  backend2:
    build: ./backend
    environment:
      - INSTANCE_ID=backend-2

  backend3:
    build: ./backend
    environment:
      - INSTANCE_ID=backend-3

  nginx:
    image: nginx:stable-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

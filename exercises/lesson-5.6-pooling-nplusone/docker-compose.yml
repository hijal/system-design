# শুধু PostgreSQL container এ — script গুলো তোমার মেশিনে সাধারণ Node process হিসেবে চলবে।
# Port 5437, যাতে তোমার মেশিনের নিজস্ব Postgres (5432) বা আগের exercise গুলোর
# (4.4 → 5433, 5.2 → 5434, 5.4 → 5435, 5.5 → 5436) সাথে সংঘাত না লাগে।
services:
  postgres:
    image: postgres:17-alpine
    # Database server কে ইচ্ছা করে ২টা CPU core এ সীমিত রাখা — যাতে pool size এর পরীক্ষা
    # (npm run pool, ধাপ ২) যেকোনো মেশিনে একই রকম ফল দেয়। Production এ এই সংখ্যা তোমার
    # database server এর core সংখ্যা।
    cpus: '2'
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5437:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

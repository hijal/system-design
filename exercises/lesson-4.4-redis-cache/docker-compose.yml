# In this exercise only the two datastores run in containers - the app itself
# runs as an ordinary Node process on your machine.
# 5433/6380 are used instead of the default ports, so they do not clash with any
# Postgres/Redis already running on your machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    # maxmemory-policy is Lesson 4.3's decision - a pure cache, so allkeys-lru
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

# Only PostgreSQL in a container - the scripts run as ordinary Node processes on your machine.
# Port 5434, so it doesn't clash with your machine's own Postgres (5432) or Lesson 4.4's exercise (5433).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

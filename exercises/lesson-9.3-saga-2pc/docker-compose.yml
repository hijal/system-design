# Only Postgres. Three databases in the same container: taskflow (the monolith, for comparison), tasks_svc (the work service —
# also holding the saga orchestrator's and the 2PC coordinator's log), billing_svc (the billing service). Separate databases
# mean an ordinary transaction can't touch both — as it would be on separate machines.
#
# max_prepared_transactions: two-phase commit (PREPARE TRANSACTION) is off (0) by default in Postgres —
# it is turned on here. Port 5448 — no clash with the earlier exercises.
services:
  postgres:
    image: postgres:17-alpine
    command: ['postgres', '-c', 'max_prepared_transactions=100']
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5448:5432'
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

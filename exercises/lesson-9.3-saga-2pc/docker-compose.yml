# শুধু Postgres। একই container এ তিনটা database: taskflow (monolith, তুলনার জন্য), tasks_svc (work service —
# saga এর orchestrator আর 2PC এর coordinator এর log ও এখানে), billing_svc (billing service)। আলাদা database
# মানে একটা সাধারণ transaction দুটোকে ছুঁতে পারে না — যেমন আলাদা machine এ হতো।
#
# max_prepared_transactions: Postgres এ two-phase commit (PREPARE TRANSACTION) default এ বন্ধ (0) —
# এখানে চালু করা হয়েছে। Port 5448 — আগের exercise গুলোর সাথে সংঘাত নেই।
services:
  postgres:
    image: postgres:17-alpine
    command: ['postgres', '-c', 'max_prepared_transactions=100']
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5448:5432'
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

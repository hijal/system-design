# Postgres (comments and the outbox) and Redis (the event stream) — both in containers; the writer, relay and
# scenario are ordinary Node processes on your machine. Ports 5443/6382, so they do not clash with the earlier exercises.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5443:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    # The event stream's Redis — like a queue's: it drops nothing, and survives a restart (Lesson 7.3)
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    ports:
      - '6382:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

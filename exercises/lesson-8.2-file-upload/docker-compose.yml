# SeaweedFS — an S3-compatible object store (like Lesson 8.1), but this time with authentication on: s3.json has
# one identity, so every request's signature is really verified — essential for testing presigned URLs
# (without authentication SeaweedFS doesn't even look at signatures). The scripts are ordinary Node processes on your machine.
# Port 8336 — no clash with the earlier exercises.
services:
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=100
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - '8336:8333'
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

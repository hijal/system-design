# Only Postgres — TaskFlow's OLTP database, where the comments live. pg_trgm and full-text search are both
# built into Postgres, nothing else is needed. cpus: 2 — like Lesson 7.6/8.1, so the numbers stay close
# across machines. Port 5446 — no clash with the earlier exercises.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5446:5432'
    cpus: 2
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

# Only Postgres - for transaction.ts. Three databases in the same container: taskflow (the monolith), and
# tasks_svc, billing_svc (each service's own database - "database per service"). Separate databases
# mean one transaction can't touch both, as it would be on separate machines. Port 5447 - no clash with the earlier
# exercises. latency and failure don't need Docker.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5447:5432'
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

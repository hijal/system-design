# শুধু Postgres — transaction.ts এর জন্য। একই container এ তিনটা database: taskflow (monolith), আর
# tasks_svc, billing_svc (প্রতিটা service এর নিজের database — "database per service")। আলাদা database
# মানে একটা transaction দুটোকে ছুঁতে পারে না, যেমন আলাদা machine এ হতো। Port 5447 — আগের exercise গুলোর
# সাথে সংঘাত নেই। latency আর failure এ Docker লাগে না।
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5447:5432'
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 2s
      timeout: 3s
      retries: 15

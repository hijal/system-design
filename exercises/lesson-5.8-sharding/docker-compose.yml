# Lesson 5.8 — three separate PostgreSQL instances, each one a "shard".
# shard0 is also used for the partitioning demo (npm run partition).
# Ports 5440–5442 — to avoid clashing with the earlier exercises (5433–5439).
x-shard: &shard
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: taskflow
    POSTGRES_PASSWORD: taskflow
    POSTGRES_DB: taskflow
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U taskflow']
    interval: 2s
    timeout: 3s
    retries: 15

services:
  shard0:
    <<: *shard
    ports:
      - '5440:5432'
  shard1:
    <<: *shard
    ports:
      - '5441:5432'
  shard2:
    <<: *shard
    ports:
      - '5442:5432'
